<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>The sky over London</title>
<meta name="theme-color" content="#05070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@400;500&display=swap">
<style>
/* Uma noite só, de propósito: o céu é escuro. Azul meia-noite e dourado.
   Layout: o céu ocupa a tela inteira; título e hora em cima, controles embaixo,
   o cartão da estrela e o painel "esta noite" por cima do céu. */
:root{
  --noite:#05070f; --noite-2:#0d1428; --ouro:#d8b45a; --ouro-claro:#f0d890; --prata:#b9c3dd;
  --tinta:#e9e6dc; --apagado:#7c86a3; --linha:#2a345a;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --corpo:"Jost","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--noite);color:var(--tinta);font-family:var(--corpo);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.topo{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:12px 16px 0;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.titulo{font-family:var(--display);font-size:22px;line-height:1.1}
.titulo i{color:var(--ouro)}
.quando{font-size:12px;color:var(--prata);margin-top:4px;font-variant-numeric:tabular-nums}
.lua{font-size:12px;color:var(--apagado);text-align:right;max-width:46%}
.lua b{display:block;color:var(--ouro-claro);font-weight:500}
.baixo{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);padding:0 16px 12px;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.linha{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:100%;max-width:660px}
button{font:500 13px var(--corpo);color:var(--tinta);background:rgba(13,20,40,.78);border:1px solid var(--linha);
  border-radius:999px;padding:8px 12px;min-height:38px;cursor:pointer;backdrop-filter:blur(6px)}
button[aria-pressed="true"]{border-color:var(--ouro);color:var(--ouro-claro)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ouro-claro);outline-offset:2px}
.horas{display:flex;align-items:center;gap:10px;width:100%;max-width:660px;font-size:12px;color:var(--apagado)}
.horas input[type=range]{flex:1;accent-color:var(--ouro)}
input[type=datetime-local]{font:13px var(--corpo);color:var(--tinta);background:rgba(13,20,40,.78);border:1px solid var(--linha);
  border-radius:999px;padding:7px 10px;color-scheme:dark}
.cartao{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--baixo,160px) + 10px);
  background:rgba(13,20,40,.93);border:1px solid var(--linha);border-radius:14px;padding:10px 14px;max-width:min(88vw,380px);
  font-size:13px;line-height:1.45;color:var(--prata);pointer-events:none}
.cartao b{display:block;font-family:var(--display);font-size:21px;font-weight:500;color:var(--tinta)}
.cartao small{display:block;color:var(--apagado);margin-top:4px}
.aviso{font-size:11px;color:var(--apagado);text-align:center;max-width:540px}
/* o painel e o cartão se encaixam entre o topo e os botões, medidos pela página (--topo, --baixo) */
.painel{position:fixed;right:16px;top:calc(var(--topo,70px) + 8px);bottom:calc(var(--baixo,160px) + 10px);width:min(340px,calc(100vw - 32px));
  overflow:auto;overscroll-behavior:contain;box-sizing:border-box;background:rgba(9,14,30,.94);border:1px solid var(--linha);border-radius:16px;
  padding:14px 16px;font-size:13px;line-height:1.5;color:var(--prata)}
.painel h2{font-family:var(--display);font-weight:500;font-size:22px;color:var(--tinta);margin:0 0 6px}
.painel h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ouro);margin:14px 0 4px;font-weight:500}
.painel ul{list-style:none;margin:0;padding:0}
.painel li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(42,52,90,.5)}
.painel li span:last-child{color:var(--tinta);text-align:right;font-variant-numeric:tabular-nums}
.painel p{margin:4px 0}
/* no celular: botões do tamanho do dedo, e as opções guardadas numa gaveta que abre e fecha,
   pra sobrar céu na tela */
#bMais{display:none}
@media (pointer:coarse){
  button{font-size:15px;min-height:46px;padding:10px 16px}
  input[type=datetime-local]{font-size:15px;min-height:46px;padding:8px 14px}
  .horas{font-size:13px} .horas input[type=range]{height:34px}
  .aviso{font-size:12px}
}
@media (max-width:700px){
  #bMais{display:inline-block}
  .opcoes{display:none}
  .opcoes.aberta{display:flex;background:rgba(9,14,30,.94);border:1px solid var(--linha);border-radius:18px;padding:10px}
  .linha{gap:8px}
  .titulo{font-size:20px}
}
@media (prefers-reduced-motion:reduce){ .cartao{transition:none} }
</style>

</head>
<body>
<canvas id="ceu" aria-label="The sky over London, with the stars in their real places"></canvas>

<div class="topo">
  <div>
    <div class="titulo">The sky over London <i>ψ</i></div>
    <div class="quando" id="quando">now</div>
  </div>
  <div class="lua" id="lua"></div>
</div>

<div class="cartao" id="cartao" hidden></div>
<section class="painel" id="painel" hidden aria-label="Tonight"></section>

<div class="baixo">
  <div class="horas">
    <span>−12h</span>
    <input type="range" id="horas" min="-720" max="720" step="5" value="0" aria-label="Move through the hours">
    <span>+12h</span>
  </div>
  <div class="linha">
    <button id="bAgora">now</button>
    <button id="bNoite" aria-pressed="false">tonight</button>
    <button id="bMais" aria-expanded="false" aria-controls="opcoes">options</button>
  </div>
  <div class="linha opcoes" id="opcoes">
    <input type="datetime-local" id="dia" aria-label="Choose a date and time">
    <button id="bNomes" aria-pressed="true">constellations</button>
    <button id="bFundo" aria-pressed="true">galaxies and nebulae</button>
    <button id="bCidade" aria-pressed="false">with the city lights</button>
    <button id="bSom" aria-pressed="true">sound of the stars</button>
    <button id="bApontar" aria-pressed="false" hidden>point at the sky</button>
  </div>
  <div class="aviso" id="aviso">drag to look around · pinch or scroll to zoom · tap a star to learn its name</div>
</div>

const DO3 = 130.81;

function somDaEstrela(bv){

  // todas descem as mesmas 40 oitavas: assim a azul soa aguda e a vermelha soa grave, sempre
  const oitavas = 40;

    const corte = audio.createBiquadFilter(); corte.type = 'lowpass'; corte.frequency.value = 7200;

const riscos = []; let ultimoRisco = 0;

// o chão: os telhados contra o céu, e a terra embaixo, com os pontos cardeais
function desenharChao(){
  const borda = [];
  for (let az = 0; az <= 360; az += 0.5) borda.push(proj(doAltAz(alturaDoTelhado(az), az)));
  ctx.fillStyle = 'rgb(3,4,8)';
  const passo = 3;
  for (let px = 0; px < W; px += passo) {
    const cruza = [];
    for (let i = 1; i < borda.length; i++) { const a = borda[i-1], b = borda[i]; if (!a || !b || Math.abs(a[0]-b[0]) > W/2) continue;
      if ((a[0]-px)*(b[0]-px) <= 0) cruza.push(a[1] + (b[1]-a[1])*((px-a[0])/((b[0]-a[0])||1))); }
    // cada pedaço da coluna, entre um cruzamento e outro, pergunta: eu estou abaixo do horizonte?
    const cortes = [0, ...cruza.filter(y => y > 0 && y < H).sort((a, b) => a - b), H];
    for (let k = 1; k < cortes.length; k++) {
      const y0 = cortes[k-1], y1 = cortes[k]; if (y1 - y0 < 0.5) continue;
      const v = desproj(px + passo/2, (y0 + y1)/2); if (!v) continue;

  ctx.stroke();
  ctx.fillStyle = '#d8b45a'; ctx.font = '500 13px Jost, system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const [az, n] of [[0,'N'],[45,'NE'],[90,'E'],[135,'SE'],[180,'S'],[225,'SW'],[270,'W'],[315,'NW']]) {
    const q = proj(doAltAz(-3, az)); if (naTela(q)) ctx.fillText(n, q[0], q[1] + 10);

  const Q = quadro;
  document.getElementById('quando').textContent = fmt.format(new Date(Q.t)) + ' · London' + (Math.abs(Q.t - Date.now()) < 120000 ? ' · now' : '');
  const [, palavra, desenho] = nomeDaLua(Q.l.elong), el = document.getElementById('lua');
  el.textContent = `${desenho} ${palavra}, ${Math.round(Q.l.luz*100)}%`;
  if (Q.chuva) { const b = document.createElement('b'); b.textContent = `☄ ${Q.chuva.c[0]} tonight`; el.append(b); }
}

const painel = document.getElementById('painel');
const PONTOS = ['north','northeast','east','southeast','south','southwest','west','northwest'];
const lado = az => PONTOS[Math.round(az/45)%8];
// procura, nas próximas 24 horas, quando um corpo nasce, se põe e chega mais alto com o céu escuro
function passagem(pos, t0){
  let nasce = null, poe = null, melhor = null, antes = null, viuEscuro = false, noiteAcabou = false;
  for (let k = 0; k <= 24*6; k++) {
    const t = t0 + k*600000, L = lst(t), d = jd(t) - 2451543.5;
    const alt = altAz(pos(d, L))[0];
    const s = sol(d), se = eclEq(s.lon, 0, d), escuro = altAz(local(se[0], se[1], L))[0] < -10;
    if (antes !== null) { if (antes < 0 && alt >= 0 && !nasce) nasce = t; if (antes >= 0 && alt < 0 && !poe) poe = t; }
    // "melhor" é só desta noite: quando o céu clareia depois de ter escurecido, a noite acabou
    if (escuro) viuEscuro = true; else if (viuEscuro) noiteAcabou = true;
    if (escuro && !noiteAcabou && alt > 0 && (!melhor || alt > melhor.alt)) melhor = {alt, t, az: altAz(pos(d, L))[1]};
    antes = alt;
  }
  return {nasce, poe, melhor};
}
function proximasLuas(t0){
  const fora = []; let antes = lua(jd(t0) - 2451543.5).elong;
  for (let k = 1; k < 24*62 && fora.length < 4; k++) {
    const t = t0 + k*3600000, el = lua(jd(t) - 2451543.5).elong;
    // achou a hora: afina até o minuto
    const afinar = (alvo) => { let a = t - 3600000, b = t;
      for (let n = 0; n < 8; n++) { const m = (a+b)/2, e = lua(jd(m) - 2451543.5).elong;
        const passou = alvo === 180 ? e >= 180 && e < 270 : e < 90; if (passou) b = m; else a = m; }
      return b; };
    if (antes < 180 && el >= 180) fora.push(['🌕 full moon', afinar(180)]);
    if (el < antes) fora.push(['🌑 new moon', afinar(0)]);
    antes = el;
  }
  return fora;
}
function escreverPainel(){
  const Q = quadro, t0 = Q.t;
  const linhas = [];
  const item = (a, b) => { const li = document.createElement('li'); const s1 = document.createElement('span'), s2 = document.createElement('span'); s1.textContent = a; s2.textContent = b; li.append(s1, s2); return li; };
  painel.innerHTML = '';
  const h2 = document.createElement('h2'); h2.textContent = 'Tonight'; painel.append(h2);
  const p = document.createElement('p'); p.textContent = `from ${fmtD.format(new Date(t0))}, ${fmtH.format(new Date(t0))}, seen from London`; painel.append(p);

  const sec = (titulo) => { const h3 = document.createElement('h3'); h3.textContent = titulo; const ul = document.createElement('ul'); painel.append(h3, ul); return ul; };
  const ul1 = sec('The Moon and the planets');
  const pos = {Moon: (d, L) => luaLocal(lua(d), L)};
  for (const n of Object.keys(ELEM)) pos[n] = (d, L) => local(...planeta(n, d, sol(d)), L);
  const diaDe = t => fmtD.format(new Date(t));
  const hora = t => fmtH.format(new Date(t)) + (diaDe(t) !== diaDe(t0) ? ' (tomorrow)' : '');
  for (const [n, f] of Object.entries(pos)) {
    const ps = passagem(f, t0);
    let txt;
    if (ps.melhor) txt = `best at ${hora(ps.melhor.t)}, ${Math.round(ps.melhor.alt)}° to the ${lado(ps.melhor.az)}`;
    else txt = 'not up while the sky is dark';
    const extra = [ps.nasce ? `rises ${hora(ps.nasce)}` : null, ps.poe ? `sets ${hora(ps.poe)}` : null].filter(Boolean).join(' · ');
    ul1.append(item(n, txt + (extra ? ` · ${extra}` : '')));
  }

  const ul2 = sec('The next moons');
  for (const [n, t] of proximasLuas(t0)) ul2.append(item(n, fmtD.format(new Date(t)) + ', ' + fmtH.format(new Date(t))));

  const ul3 = sec('Meteor shower');
  if (Q.chuva) { const c = Q.chuva.c; ul3.append(item(`☄ ${c[0]}`, Q.chuva.dias < -0.5 ? `peak in ${Math.round(-Q.chuva.dias)} day(s)` : Q.chuva.dias > 0.5 ? `peaked ${Math.round(Q.chuva.dias)} day(s) ago` : 'at its peak'));
    ul3.append(item('where it comes from', c[7])); ul3.append(item('at peak, under a dark sky', `up to ~${c[6]} an hour`)); }
  const prox = proximaChuva(t0);
  if (prox) ul3.append(item(Q.chuva ? 'the next one' : `☄ ${prox.c[0]}`, `${Q.chuva ? prox.c[0] + ', ' : ''}${fmtD.format(new Date(prox.p))}`));

  const nota = document.createElement('p'); nota.style.color = 'var(--apagado)'; nota.style.marginTop = '12px';
  nota.textContent = 'times are London times. on meteor shower nights, the streaks come from the right point in the sky, but there are more of them than you would see.';
  painel.append(nota);
}

// ---------- o toque: arrastar, aproximar, perguntar o nome ----------
const toques = new Map(); let arrastou = false, pinca = 0, campo0 = campo;
tela.addEventListener('pointerdown', e => { tela.setPointerCapture(e.pointerId); toques.set(e.pointerId, [e.clientX, e.clientY]); arrastou = false;
  if (toques.size === 2) { const [a,b] = [...toques.values()]; pinca = Math.hypot(a[0]-b[0], a[1]-b[1]); campo0 = campo; } });
tela.addEventListener('pointermove', e => {
  if (!toques.has(e.pointerId)) return;
  const [x0,y0] = toques.get(e.pointerId); toques.set(e.pointerId, [e.clientX, e.clientY]);
  if (toques.size === 2) { const [a,b] = [...toques.values()]; const dd = Math.hypot(a[0]-b[0], a[1]-b[1]);
    campo = Math.max(15, Math.min(150, campo0 * pinca / dd)); arrastou = true; mudou = true; return; }
  const dx = e.clientX - x0, dy = e.clientY - y0; if (Math.abs(dx)+Math.abs(dy) > 2) arrastou = true;
  const grau = campo / Math.min(W,H);
  olharAz = norm(olharAz - dx*grau*1.1); olharAlt = Math.max(-30, Math.min(90, olharAlt + dy*grau*1.1));
  if (apontando) pararDeApontar();
  mudou = true;
});
const soltar = e => { if (toques.size === 1 && !arrastou) tocar(e.clientX, e.clientY); toques.delete(e.pointerId); };
tela.addEventListener('pointerup', soltar); tela.addEventListener('pointercancel', e => toques.delete(e.pointerId));
tela.addEventListener('wheel', e => { e.preventDefault(); campo = Math.max(15, Math.min(150, campo * (e.deltaY > 0 ? 1.1 : 0.9))); mudou = true; }, {passive:false});

const cartao = document.getElementById('cartao'); let cartaoT;
function tocar(x, y){
  let melhor = null, dist = 26;
  for (const o of clicaveis) { const raio = o.raio || (o.tipo === 'corpo' ? 6 : o.nome ? 3 : 0);
    const dd = Math.hypot(o.x-x, o.y-y) - raio; if (dd < dist) { dist = dd; melhor = o; } }
  if (!melhor) { cartao.hidden = true; return; }
  const v = melhor.v || local(CEU.E[melhor.i][0], CEU.E[melhor.i][1], quadro.L);
  const [alt, az] = altAz(v);
  const onde = alt > 0 ? `${Math.round(alt)}° up, to the ${lado(az)}` : `below the horizon now, to the ${lado(az)}`;
  let titulo, linha, nota = '', som = '';
  const hz = f => f.toFixed(f < 200 ? 1 : 0) + ' Hz';
  if (melhor.tipo === 'corpo') {
    titulo = melhor.nome;
    if (melhor.lua) linha = `${nomeDaLua(melhor.lua.elong)[1]}, ${Math.round(melhor.lua.luz*100)}% lit · ${onde}`;
    else if (melhor.nome === 'Sun') linha = onde;
    else { linha = `planet · ${onde}`; nota = SOBRE_PLANETA[melhor.nome]; }
    const v = somDaVolta(melhor.nome);
    const volta = melhor.nome === 'Sun' ? 'the day, 24 hours' : melhor.nome === 'Moon' ? 'the Moon’s month, 29.5 days' : `the year of ${melhor.nome}, ${v.dias >= 1000 ? (v.dias/365.25).toFixed(1) + ' of our years' : Math.round(v.dias) + ' days'}`;
    som = `♪ ${hz(v.f)}: ${volta}, raised ${v.oitavas} octaves`;
    tocarNota(v.f, 0.9);
  } else if (melhor.tipo === 'fundo') {
    const f = melhor.f; titulo = f[0]; linha = `${TIPO[f[3]]} · ${f[5]} away · ${onde}`; nota = f[6];
  } else if (melhor.tipo === 'chuva') {
    const c = melhor.chuva.c; titulo = `☄ ${c[0]}`; linha = `the point the meteors seem to come from · ${onde}`; nota = c[7];
  } else {
    titulo = melhor.nome ? (melhor.nome === 'Vega' ? 'Vega ψ' : melhor.nome) : 'a star with no proper name';
    const c = melhor.c ? `in ${NOME_CONST[melhor.c] || melhor.c} · ` : '';
    linha = `${c}magnitude ${melhor.mag.toFixed(1)} · ${onde}`;
    if (melhor.nome === 'Vega') nota = 'the brightest star in Lyra, 25 light-years away. about 14,000 years ago it was the pole star, and it will be again.';
    const e = somDaEstrela(CEU.E[melhor.i][3]);
    som = `♪ ${hz(e.f)}: the colour of its light, about ${Math.round(e.T/100)*100} K, lowered ${e.oitavas} octaves`;
    tocarNota(e.f, forcaDaMagnitude(melhor.mag));
  }
  cartao.innerHTML = ''; const b = document.createElement('b'); b.textContent = titulo; cartao.append(b, document.createTextNode(linha));
  if (nota) { const s = document.createElement('small'); s.textContent = nota; cartao.append(s); }
  if (som && comSom) { const s = document.createElement('small'); s.style.color = 'var(--ouro-claro)'; s.textContent = som; cartao.append(s); }
  cartao.hidden = false; clearTimeout(cartaoT); cartaoT = setTimeout(()=>cartao.hidden = true, 8000);
}

// ---------- os botões ----------
const horas = document.getElementById('horas'), dia = document.getElementById('dia');
horas.addEventListener('input', () => { desloc = +horas.value; mudou = true; });
function irPara(ms){ base = ms; desloc = 0; horas.value = 0; mudou = true; }
document.getElementById('bAgora').onclick = () => irPara(Date.now());
dia.addEventListener('change', () => { const ms = new Date(dia.value).getTime(); if (!isNaN(ms)) irPara(ms); });
const alternar = (id, fn) => { const b = document.getElementById(id); b.onclick = () => { const v = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', v); fn(v); mudou = true; }; };
alternar('bNomes', v => comNomes = v);
alternar('bFundo', v => comFundo = v);
alternar('bCidade', v => comCidade = v);
alternar('bNoite', v => { painel.hidden = !v; painelDe = null; });
alternar('bSom', v => { comSom = v; if (v) acordarSom(); });
// o som só pode nascer de um toque dela. o celular aceita no fim do toque (touchend, click),
// não no começo; então acorda em todos, até o aparelho de som estar de pé
function destravarSom(){
  if (!comSom) return;
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'playback';   // iPhone: tocar como música
    acordarSom();
    const vazio = audio.createBuffer(1, 1, audio.sampleRate), src = audio.createBufferSource();
    src.buffer = vazio; src.connect(audio.destination); src.start(0);
  } catch (_) {}
}
for (const ev of ['pointerup', 'touchend', 'click', 'keydown']) addEventListener(ev, destravarSom, {passive:true});
document.getElementById('bMais').onclick = () => { const o = document.getElementById('opcoes'), b = document.getElementById('bMais');
  const abre = !o.classList.contains('aberta'); o.classList.toggle('aberta', abre); b.setAttribute('aria-expanded', abre); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && audio) audio.resume().catch(()=>{}); });
if (window.ResizeObserver) new ResizeObserver(medir).observe(document.querySelector('.baixo'));

// apontar o celular pro céu: só aparece em celular, e só funciona onde o aparelho deixar a página ler a bússola
const bApontar = document.getElementById('bApontar'), aviso = document.getElementById('aviso');
if (window.DeviceOrientationEvent && matchMedia('(pointer:coarse)').matches) bApontar.hidden = false;
let ouviuSensor = false;
function sentirOrientacao(e){
  const rumo = e.webkitCompassHeading != null ? e.webkitCompassHeading : (e.absolute && e.alpha != null ? norm(360 - e.alpha) : null);
  if (rumo == null || e.beta == null) return;
  ouviuSensor = true; olharAz = norm(rumo); olharAlt = Math.max(-30, Math.min(90, e.beta - 90)); mudou = true;
}
function pararDeApontar(){ apontando = false; bApontar.setAttribute('aria-pressed', 'false');
  removeEventListener('deviceorientationabsolute', sentirOrientacao); removeEventListener('deviceorientation', sentirOrientacao); }
bApontar.onclick = async () => {
  if (apontando) { pararDeApontar(); return; }
  try { if (typeof DeviceOrientationEvent.requestPermission === 'function') { const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') throw 0; } }
  catch(_) { aviso.textContent = 'this phone did not let the page use its compass. you can still look around by dragging.'; return; }
  apontando = true; bApontar.setAttribute('aria-pressed', 'true'); ouviuSensor = false;
  addEventListener('deviceorientationabsolute', sentirOrientacao); addEventListener('deviceorientation', sentirOrientacao);
  aviso.textContent = 'hold your phone up to the sky, screen facing you';
  setTimeout(() => { if (apontando && !ouviuSensor) { pararDeApontar();
    aviso.textContent = 'the compass did not answer on this page. you can still look around by dragging.'; } }, 2500);
};

// o céu anda sozinho, devagar, enquanto ela olha
setInterval(() => { if (desloc === 0 && Math.abs(base - Date.now()) < 180000) { base = Date.now(); mudou = true; } }, 30000);
if (document.fonts) document.fonts.ready.then(() => mudou = true);
medir();
requestAnimationFrame(desenhar);
</script>
